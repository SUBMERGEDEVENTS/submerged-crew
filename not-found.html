<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team not found · Woosah</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Barlow:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0d1b2e;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --cyan: #00D4C8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      color: var(--text);
      font-family: Barlow, system-ui, sans-serif;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    .wordmark {
      font-family: "Lilita One", Barlow, sans-serif;
      font-size: clamp(36px, 8vw, 52px);
      letter-spacing: 0.04em;
      margin: 0 0 0.75rem;
    }
    p { color: var(--muted); margin: 0 0 1.25rem; font-weight: 600; }
    a { color: var(--cyan); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div>
    <h1 class="wordmark">Woosah</h1>
    <p>Team not found.</p>
    <a href="/">Back to Woosah</a>
  </div>
</body>
</html>
