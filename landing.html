<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Woosah</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Barlow:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0d1b2e;
      --navy2: #0a1525;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --cyan: #00D4C8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      color: var(--text);
      font-family: Barlow, system-ui, sans-serif;
      padding: 2rem 1.25rem;
    }
    .wrap { text-align: center; max-width: 28rem; }
    .wordmark {
      font-family: "Lilita One", Barlow, sans-serif;
      font-size: clamp(42px, 10vw, 64px);
      letter-spacing: 0.04em;
      margin: 0 0 0.75rem;
    }
    .tag {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    form { margin-top: 1.5rem; display: none; text-align: left; }
    form.visible { display: block; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    input, button {
      font: inherit;
      width: 100%;
      border-radius: 8px;
      padding: 10px 12px;
    }
    input {
      background: var(--navy2);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      margin-bottom: 10px;
    }
    button {
      background: var(--cyan);
      border: 0;
      color: #0a1525;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      var isAuth =
        params.has('code') ||
        params.has('token_hash') ||
        hash.has('access_token') ||
        hash.has('refresh_token') ||
        /^(recovery|signup|magiclink|email|invite)$/.test(hash.get('type') || params.get('type') || '');
      if (!isAuth) return;
      var slug = null;
      try { slug = localStorage.getItem('woosah_tenant'); } catch (e) {}
      if (slug && /^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$/.test(slug)) {
        location.replace('/' + slug + location.search + location.hash);
        return;
      }
      document.addEventListener('DOMContentLoaded', function () {
        var form = document.getElementById('team-form');
        if (!form) return;
        form.classList.add('visible');
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var value = (document.getElementById('team-slug').value || '').trim().toLowerCase();
          if (!/^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$/.test(value)) return;
          try { localStorage.setItem('woosah_tenant', value); } catch (err) {}
          location.replace('/' + value + location.search + location.hash);
        });
      });
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <h1 class="wordmark">Woosah</h1>
    <p class="tag">Invite-only early access. Coming soon.</p>
    <form id="team-form">
      <label for="team-slug">Open your team link to finish signing in</label>
      <input id="team-slug" type="text" autocomplete="off" spellcheck="false" placeholder="your-team" />
      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
